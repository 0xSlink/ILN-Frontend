<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed brand-primary background (matches the app's color-primary token and manifest theme_color). -->
  <rect width="512" height="512" fill="#3d627f" />
  <!-- "ILN" monogram kept inside the maskable safe zone: an inscribed circle of
       80% of the icon's diameter (radius 204.8 centered at 256,256), per
       https://web.dev/maskable-icon/ - so this same file is safe to use for
       both purpose: "any" and purpose: "maskable". -->
  <text
    x="256"
    y="256"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="176"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="central"
  >ILN</text>
</svg>
