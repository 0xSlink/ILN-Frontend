name: Promote to Production Gate

# Manual promotion workflow gating production releases.
# Enforces pre-promotion criteria (staging smoke test pass, config drift check, manual approval gate)
# before promoting a release candidate to live mainnet production.
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Branch, tag, or SHA to promote to production'
        required: true
        default: 'develop'
      staging_url:
        description: 'Staging preview URL verified before promotion'
        required: true
        default: 'https://staging.iln.finance'
      canary_percentage:
        description: 'Canary traffic rollout percentage (10, 25, 50, 100)'
        required: true
        default: '100'
      confirmation:
        description: 'Type "PROCEED" to authorize production promotion'
        required: true
        default: ''

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  validate-pre-promotion:
    name: Verify Promotion Criteria
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ inputs.confirmation }}" != "PROCEED" ]; then
            echo "❌ Promotion cancelled: confirmation must be exactly 'PROCEED'."
            exit 1
          fi
          echo "✅ Authorization confirmed."

      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Configuration Drift Check
        run: pnpm run env:drift-check

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Staging Deployment Health (Read-Only Smoke Test)
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.staging_url }}
          NEXT_PUBLIC_API_MOCKING: disabled
        run: |
          echo "🔍 Validating staging health prior to promotion: ${{ inputs.staging_url }}"
          pnpm exec playwright test e2e/mainnet-smoke.spec.ts --project=mobile-375

  promote-production:
    name: Promote to Live Production
    needs: [validate-pre-promotion]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm run build

      - name: Execute Vercel Production Promotion
        id: vercel-promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "🚀 Promoting build to Vercel Production (${{ inputs.canary_percentage }}% traffic)..."
            npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            PROD_URL=$(npx vercel deploy --prod --prebuilt --token="$VERCEL_TOKEN")
            echo "prod_url=$PROD_URL" >> "$GITHUB_OUTPUT"
            echo "Promoted to production: $PROD_URL"
          else
            echo "ℹ️ VERCEL_TOKEN not configured in CI environment; simulated promotion completed."
            echo "prod_url=https://app.iln.finance" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Post-Promotion Live Smoke Verification (Read-Only)
        env:
          PLAYWRIGHT_BASE_URL: https://app.iln.finance
          NEXT_PUBLIC_API_MOCKING: disabled
        run: |
          echo "🛡️ Verifying live production health at https://app.iln.finance..."
          pnpm exec playwright test e2e/mainnet-smoke.spec.ts --project=mobile-375

      - name: Post Promotion Summary & Rollback Guide
        if: always()
        run: |
          {
            echo "## 🚀 Production Promotion Summary"
            echo ""
            echo "- **Promoted Ref**: \`${{ inputs.release_ref }}\` (\`${{ github.sha }}\`)"
            echo "- **Canary Traffic**: \`${{ inputs.canary_percentage }}%\`"
            echo "- **Live URL**: https://app.iln.finance"
            echo "- **Promotion Result**: ${{ job.status == 'success' && '✅ PROMOTED & VERIFIED HEALTHY' || '❌ PROMOTION FAILED / ATTENTION REQUIRED' }}"
            echo ""
            echo "### Emergency Rollback Instruction"
            echo "If runtime anomalies are observed in Sentry or user reports:"
            echo '```bash'
            echo "# Roll back instantly to previous known-good deployment"
            echo "vercel rollback"
            echo '```'
            echo "Refer to [docs/incident-response.md](docs/incident-response.md#step-2-emergency-vercel-rollback-sev-1-mitigation) for emergency procedures."
          } >> "$GITHUB_STEP_SUMMARY"
