name: Stellar SDK Bump and Verify

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      version:
        description: Exact @stellar/stellar-sdk version (defaults to latest)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: stellar-sdk-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Resolve SDK version
        id: sdk
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then version="$(npm view @stellar/stellar-sdk version)"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid exact SDK version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Pin SDK and update lockfile
        run: pnpm add --save-exact "@stellar/stellar-sdk@${{ steps.sdk.outputs.version }}"
      - run: pnpm install --frozen-lockfile
      - name: Run full verification suite
        run: pnpm verify
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/stellar-sdk-${{ steps.sdk.outputs.version }}
          delete-branch: true
          title: 'chore(deps): bump @stellar/stellar-sdk to ${{ steps.sdk.outputs.version }}'
          commit-message: 'chore(deps): bump @stellar/stellar-sdk to ${{ steps.sdk.outputs.version }}'
          body: |
            Automated exact-version SDK update. The complete `pnpm verify` suite passed before this PR was created.

            Review ABI compatibility and the scheduled testnet contract integration result before merging.
