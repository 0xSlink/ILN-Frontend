name: Contract Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Mocked Stellar SDK Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run contract integration tests with coverage
        run: pnpm exec vitest run __tests__/contract --reporter=verbose --coverage
        env:
          CI: true

      - name: Enforce 90% coverage on contract layer
        run: |
          node -e "
            const fs = require('fs');
            try {
              const cov = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
              const files = Object.keys(cov).filter(k => k.includes('utils/soroban') || k.includes('utils/contract-stats') || k.includes('utils/governance') || k.includes('lib/contract'));

              if (files.length === 0) {
                console.error('ERROR: No contract layer files found in coverage report');
                console.error('Expected to find files matching: utils/soroban, utils/contract-stats, utils/governance, or lib/contract');
                process.exit(1);
              }

              console.log('Files counted toward coverage threshold:');
              files.forEach(f => console.log('  ' + f));
              console.log('');

              const lines = files.reduce((acc, f) => {
                acc.total += cov[f].lines.total;
                acc.covered += cov[f].lines.covered;
                return acc;
              }, { total: 0, covered: 0 });

              const coverage = Math.round((lines.covered / lines.total) * 100);
              console.log('Contract layer coverage: ' + coverage + '%');

              if (coverage < 90) {
                console.error('FAIL: Coverage ' + coverage + '% is below the 90% threshold');
                process.exit(1);
              }
            } catch(e) {
              console.error('ERROR: Failed to read or parse coverage report');
              console.error(e.message);
              process.exit(1);
            }
          "

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-coverage
          path: coverage/
          retention-days: 14
