name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile integrity
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code pnpm-lock.yaml

      - name: Run ESLint
        run: pnpm run lint

      - name: Check env example sync
        run: pnpm run env:check

      - name: Check formatting with Prettier
        run: pnpm run format:check

      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Run npm audit for security vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Check for postinstall script changes in dependencies
        run: |
          echo "Scanning for packages with install/postinstall scripts..."
          pnpm ls --depth=0 --json | jq -r '.dependencies[] | select(has("scripts")) | select(.scripts | has("postinstall") or has("install")) | .name + " (" + .version + ")"' || true
          echo "For dependency-level postinstall detection, review pnpm-lock.yaml for 'prebuiltBinaries' and 'peerDependenciesMeta' entries on suspicious packages."

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with full coverage
        # This scans all of src/ for the Codecov report below (informational,
        # fail_ci_if_error: false) - it deliberately zeroes out the thresholds
        # from vitest.config.ts, which are scoped to the contract layer only
        # and are already enforced by contract-tests.yml.
        run: >-
          pnpm exec vitest run
          --coverage
          --coverage.include='src/**/*.{ts,tsx}'
          --coverage.exclude='**/*.stories.*'
          --coverage.exclude='**/*.test.*'
          --coverage.exclude='**/__tests__/**'
          --coverage.exclude='src/stories/**'
          --coverage.exclude='src/test-utils/**'
          --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.statements=0

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage-summary.json
          flags: unittests
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
