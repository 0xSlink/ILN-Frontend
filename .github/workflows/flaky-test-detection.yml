name: Scheduled Flaky Test Detection

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  flaky-test-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite Iteration 1
        run: pnpm test -- --run --reporter=json > results-1.json || true

      - name: Run Test Suite Iteration 2
        run: pnpm test -- --run --reporter=json > results-2.json || true

      - name: Run Test Suite Iteration 3
        run: pnpm test -- --run --reporter=json > results-3.json || true

      - name: Detect flaky tests
        if: always()
        run: |
          echo "## Flaky Test Detection Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for i in 1 2 3; do
            if [ -f "results-$i.json" ]; then
              failed=$(jq '[.testResults[] | select(.status == "failed")] | length' results-$i.json 2>/dev/null || echo "N/A")
              passed=$(jq '[.testResults[] | select(.status == "passed")] | length' results-$i.json 2>/dev/null || echo "N/A")
              echo "### Iteration $i: $passed passed, $failed failed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### Iteration $i: results not captured" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review iterations above for tests that fail intermittently." >> "$GITHUB_STEP_SUMMARY"
          echo "Tests failing in some but not all iterations are likely flaky." >> "$GITHUB_STEP_SUMMARY"
