name: Nightly Testnet E2E Smoke

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run live testnet smoke tests
        env:
          PLAYWRIGHT_BASE_URL: https://invoice-liquidity-network.vercel.app
          NEXT_PUBLIC_API_MOCKING: disabled
        run: pnpm exec playwright test e2e/testnet-smoke.spec.ts --project=mobile-375

      - name: Run live testnet governance vote journey
        env:
          PLAYWRIGHT_BASE_URL: https://invoice-liquidity-network.vercel.app
          NEXT_PUBLIC_API_MOCKING: disabled
        run: pnpm exec playwright test e2e/governance-live.spec.ts --project=mobile-375

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-testnet-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Create issue on failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly testnet E2E smoke failed for ${context.repo.repo}`;
            const body = [
              'The scheduled Playwright smoke run against the live testnet deployment failed.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci', 'automated'],
            });
