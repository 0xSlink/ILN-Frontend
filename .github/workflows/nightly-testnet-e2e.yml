name: Nightly Testnet E2E Smoke

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Live testnet deployment to smoke-test (defaults to TESTNET_SMOKE_URL repo variable)'
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # Override with the repository variable TESTNET_SMOKE_URL when the testnet
      # deployment moves. The hard-coded fallback is kept for backwards
      # compatibility but is not updated by any workflow in this repo.
      PLAYWRIGHT_BASE_URL: ${{ vars.TESTNET_SMOKE_URL || 'https://invoice-liquidity-network.vercel.app' }}
      NEXT_PUBLIC_API_MOCKING: disabled
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9.0.0'

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The live Vercel deployment can lag behind this repo. Report that here so
      # a stale build is visible in the run summary, while the smoke spec skips
      # only the affected routes and still checks every deployed route.
      - name: Check deployment freshness
        id: preflight
        run: |
          stale=""
          # Keep this list in sync with smokeRoutes in e2e/support/testnet-smoke.ts.
          for route in / /marketplace /governance /stats /leaderboard /analytics; do
            code=$(curl -LsS -o /dev/null -w '%{http_code}' --max-time 15 "$PLAYWRIGHT_BASE_URL$route" 2>/dev/null) || code=000
            echo "$route -> HTTP $code"
            if [ "$code" = "404" ]; then
              stale="$stale $route"
            fi
          done
          echo "stale_routes=$stale" >> "$GITHUB_OUTPUT"
          {
            echo "## Testnet deployment freshness"
            echo ""
            echo "- Target: \`$PLAYWRIGHT_BASE_URL\`"
            if [ -n "$stale" ]; then
              echo "- ⚠️ Stale deployment. Routes not present in the deployed build:$stale"
              echo "- The smoke run skips those routes. Redeploy the current branch in Vercel to restore coverage."
              echo "- See \`docs/troubleshooting.md\` for the diagnosis steps."
            else
              echo "- ✅ All smoke routes are deployed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run live testnet smoke tests
        run: pnpm exec playwright test e2e/testnet-smoke.spec.ts --project=mobile-375

      - name: Run live testnet governance vote journey
        run: pnpm exec playwright test e2e/governance-live.spec.ts --project=mobile-375

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-testnet-playwright-report
          path: playwright-report/
          retention-days: 7

      # Always comment on the existing tracking issue rather than opening a new
      # one every night. Repeated stale-deployment failures previously produced
      # more than a hundred identical open issues.
      - name: Report failure on the tracking issue
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly testnet E2E smoke failed for ${context.repo.repo}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled Playwright smoke run against the live testnet deployment failed.',
              '',
              `Workflow run: ${runUrl}`,
              '',
              `Stale deployment routes from this run: \`${{ steps.preflight.outputs.stale_routes || 'none' }}\``,
            ].join('\n');

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
              sort: 'created',
              order: 'asc',
            });

            if (existing.data.items.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data.items[0].number,
                body: `Another nightly smoke failure.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci', 'automated'],
              });
            }
