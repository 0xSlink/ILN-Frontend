name: PR Issue Link Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  issue-link-check:
    name: Check PR references an issue
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body and title for issue link
        id: check
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const body = context.payload.pull_request.body || '';
            const title = context.payload.pull_request.title || '';
            const pattern = /(closes|close|closed|fixes|fix|fixed|resolves|resolve|resolved)\s+#\d+/i;
            return (pattern.test(body) || pattern.test(title)).toString();

      - name: Post informational comment if missing
        if: steps.check.outputs.result == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const body = `## ⚠️ Issue Reference Missing

            This pull request does not include a reference to an issue. To ensure Drips Wave points are credited upon merge, please update the PR description to link the issue it resolves.

            Add one of the following to your PR description:

            - \`Closes #123\`
            - \`Fixes #123\`
            - \`Resolves #123\`

            *This check is informational and will not block merging — maintenance PRs are exempt.*`;

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: body,
            });

      - name: Post success comment if linked
        if: steps.check.outputs.result == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const body = `## ✅ Issue Reference Found

            This PR references an issue — Drips Wave points will be properly credited upon merge.`;

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: body,
            });
